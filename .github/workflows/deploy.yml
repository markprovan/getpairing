name: Deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

# A second push shouldn't race the first one onto the live site.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://getpairing.com
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6.0.10
        with:
          run_install: false

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build

      # Fonts are fetched at build time and a failure is only a *warning*, so
      # without this check production can silently ship the fallback stacks
      # instead of Fraunces and Newsreader. Fail rather than deploy that.
      - name: Check the fonts were actually fetched
        run: |
          set -euo pipefail
          count=$(find dist \( -name '*.woff2' -o -name '*.woff' -o -name '*.ttf' -o -name '*.otf' \) | wc -l)
          if [ "$count" -eq 0 ]; then
            echo "::error::No font files in dist/ — Astro could not fetch them. Refusing to deploy a build that would ship fallback fonts."
            exit 1
          fi
          echo "Fonts present: $count file(s)"

      # wrangler comes from the lockfile rather than a marketplace action, so the
      # deploy uses a version we've resolved and Dependabot can bump. The Pages
      # project is Direct Upload, so this is the only thing that ships the site.
      # --branch=master must match the project's production branch, or the
      # upload lands as a preview deployment instead of going live.
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler pages deploy dist --project-name=getpairing --branch=master
